[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dat-gov"
version = "0.1.0"
description = "Northbridge University — a small, lightweight model project for learning data governance: domains, medallion architecture, contracts, quality, lineage and PII handling."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
