[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dat-gov"
version = "0.1.0"
description = "Northgate Maritime — data-governance model: medallion pipeline, YAML contracts, offline sync"
requires-python = ">=3.12"
dependencies = ["duckdb>=2.0.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
