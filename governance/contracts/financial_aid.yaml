# Data contract for Silver.financial_aid
# The pipeline enforces this file; a row that breaks it is quarantined, never silently dropped.
dataset: financial_aid
subdomain: finance
owner: Director of Financial Aid
description: Aid awards per student per term.
primary_key: aid_id
columns:
- name: aid_id
  type: VARCHAR
  nullable: false
  description: Stable aid key, e.g. AID-000001.
- name: student_id
  type: VARCHAR
  nullable: false
  description: FK to students.student_id.
- name: term
  type: VARCHAR
  nullable: false
  description: Term code.
- name: aid_type
  type: VARCHAR
  nullable: false
  description: grant / scholarship / loan / work-study.
- name: amount
  type: DOUBLE
  nullable: false
  description: Award amount in CAD, >= 0.
- name: status
  type: VARCHAR
  nullable: false
  description: awarded / disbursed / declined.
checks:
- name: pk_unique
  type: unique
  column: aid_id
- name: amount_non_negative
  type: range
  column: amount
  min: 0
- name: term_allowed
  type: allowed_values
  column: term
  values:
  - 2024-Fall
  - 2025-Spring
  - 2025-Fall
  - 2026-Spring
- name: fk_student
  type: foreign_key
  column: student_id
  references: students.student_id
